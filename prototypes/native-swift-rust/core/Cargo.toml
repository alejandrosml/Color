[package]
name = "edupaint_core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
# The oldest Rust this code can be compiled with: the core itself uses the
# standard library of 1.88 (usvg 0.48 asks for 1.85). It is a floor, not the
# version the project is qualified with: that one is the Rust of Homebrew,
# named in scripts/rust-reference.json.
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
# The examples in the comments are descriptions of formats, not programs.
doctest = false

[features]
default = ["svg"]
# Reading SVG files — the pictures of the interface, colouring pages — with
# usvg, the reading half of resvg. It is the only dependency of the core, and
# its sources are kept in vendor/: nothing is downloaded to build Color.
# Without this feature the core has no dependency at all and still compiles
# with rustc alone (src/lib.rs), as the older scripts of the project do.
svg = ["dep:usvg"]

[dependencies]
usvg = { version = "=0.48.1", default-features = false, optional = true }

# One optimization unit for the whole core and its library, link-time
# optimization across them: smaller and a little faster (measured in
# docs/JALON-1.0.1.md). Never opt-level "s" or "z": they make the first use of
# the catalogues 1.5 to 3.4 times slower. LTO applies when cargo builds one
# linkable kind at a time — `cargo rustc --crate-type cdylib` (Android, Mac,
# Linux, Windows) or `--crate-type staticlib` (iPhone, iPad) — not to the rlib.
[profile.release]
lto = "fat"
codegen-units = 1
# A panic stops the program: nothing of the core catches one any more, now
# that the cores of the stores read no SVG (R-11 of the retrospective). The
# tests, and the readers of SVG that they use, still unwind: cargo builds
# tests that way whatever the profile says.
panic = "abort"
