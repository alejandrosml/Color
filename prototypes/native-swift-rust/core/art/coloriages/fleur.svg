  <line x1="280" y1="474" x2="306" y2="464" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="280" y1="504" x2="306" y2="494" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <polyline points="236,386 235,376 231,366 224,359 216,354" fill="none" stroke="#2f3d4a" stroke-width="6"/>
