  <ellipse cx="684" cy="562" rx="72" ry="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="618" y1="562" x2="740" y2="562" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le pot -->
  <rect x="500" y="640" width="200" height="112" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <rect x="468" y="596" width="264" height="64" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Les pétales -->
  <circle cx="600" cy="188" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="672" cy="218" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="702" cy="290" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
