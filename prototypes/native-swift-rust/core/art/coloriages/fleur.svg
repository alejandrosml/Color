  <ellipse cx="932" cy="240" rx="42" ry="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="1004" cy="240" rx="42" ry="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="968" y1="146" x2="968" y2="270" fill="none" stroke="#2f3d4a" stroke-width="18"/>
