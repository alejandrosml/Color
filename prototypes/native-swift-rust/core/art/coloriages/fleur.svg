<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : page à colorier « La fleur ». Dessin original, feuille de 1200 × 800. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" stroke-linecap="round" stroke-linejoin="round">
  <title>La fleur</title>
  <desc>Une grande fleur qui sourit dans son pot, avec ses deux feuilles, une coccinelle et un papillon qui viennent la voir.</desc>
