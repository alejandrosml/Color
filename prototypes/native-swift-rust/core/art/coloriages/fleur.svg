  <circle cx="528" cy="362" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="498" cy="290" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="528" cy="218" r="58" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le cœur de la fleur -->
  <circle cx="600" cy="290" r="64" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <polyline points="578,274 579,274" fill="none" stroke="#2f3d4a" stroke-width="14"/>
