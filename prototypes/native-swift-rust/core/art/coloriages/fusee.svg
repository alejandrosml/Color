  <line x1="330" y1="678" x2="330" y2="722" fill="none" stroke="#2f3d4a" stroke-width="5"/>
  <line x1="311" y1="689" x2="349" y2="711" fill="none" stroke="#2f3d4a" stroke-width="5"/>
