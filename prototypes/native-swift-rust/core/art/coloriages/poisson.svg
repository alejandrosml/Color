<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : page à colorier « Le poisson ». Dessin original, feuille de 1200 × 800. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" stroke-linecap="round" stroke-linejoin="round">
  <title>Le poisson</title>
  <desc>Un gros poisson tacheté qui fait des bulles au fond de la mer, entre les algues et les cailloux.</desc>
  <!-- Les algues -->
  <ellipse cx="126" cy="556" rx="32" ry="112" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="190" cy="600" rx="30" ry="70" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="1066" cy="566" rx="32" ry="102" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="1004" cy="610" rx="30" ry="62" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le sable -->
  <rect x="60" y="652" width="1080" height="98" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="330" cy="702" rx="64" ry="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="860" cy="704" rx="76" ry="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- La queue et les nageoires -->
  <circle cx="860" cy="380" r="108" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="838" y1="340" x2="944" y2="316" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="842" y1="380" x2="960" y2="380" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="838" y1="420" x2="944" y2="444" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="560" cy="206" rx="112" ry="62" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <ellipse cx="596" cy="552" rx="80" ry="60" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le corps -->
  <ellipse cx="560" cy="380" rx="262" ry="166" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <polyline points="455,290 466,308 473,330 478,354 480,380 478,406 473,430 466,452 455,470" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <polyline points="560,300 561,300" fill="none" stroke="#2f3d4a" stroke-width="24"/>
  <polyline points="650,352 651,352" fill="none" stroke="#2f3d4a" stroke-width="30"/>
  <polyline points="580,430 581,430" fill="none" stroke="#2f3d4a" stroke-width="30"/>
  <polyline points="700,448 701,448" fill="none" stroke="#2f3d4a" stroke-width="22"/>
  <polyline points="520,360 521,360" fill="none" stroke="#2f3d4a" stroke-width="18"/>
  <!-- L’œil et la bouche -->
  <circle cx="392" cy="334" r="40" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <polyline points="404,330 405,330" fill="none" stroke="#2f3d4a" stroke-width="22"/>
  <polyline points="357,415 351,421 343,425 334,426 325,425 317,421 311,415" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Les bulles -->
  <circle cx="250" cy="262" r="30" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="200" cy="176" r="36" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="262" cy="96" r="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
</svg>
