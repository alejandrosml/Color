<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : page à colorier « La voiture ». Dessin original, feuille de 1200 × 800. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" stroke-linecap="round" stroke-linejoin="round">
  <title>La voiture</title>
  <desc>Une petite voiture qui roule sur la route, avec ses fenêtres, ses phares et ses roues, sous le soleil et un nuage.</desc>
  <!-- La route -->
  <rect x="60" y="638" width="1080" height="110" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="110" y1="698" x2="190" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="290" y1="698" x2="370" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="470" y1="698" x2="550" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="650" y1="698" x2="730" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="830" y1="698" x2="910" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="1010" y1="698" x2="1090" y2="698" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <!-- Le soleil -->
  <circle cx="1030" cy="160" r="60" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="1106" y1="191" x2="1133" y2="203" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="1061" y1="236" x2="1073" y2="263" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="999" y1="236" x2="987" y2="263" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="954" y1="191" x2="927" y2="203" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="954" y1="129" x2="927" y2="117" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="999" y1="84" x2="987" y2="57" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="1061" y1="84" x2="1073" y2="57" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="1106" y1="129" x2="1133" y2="117" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le nuage -->
  <circle cx="200" cy="160" r="46" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="300" cy="164" r="42" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="250" cy="132" r="56" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- La fumée -->
  <circle cx="176" cy="528" r="30" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="116" cy="488" r="36" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le haut de la voiture -->
  <rect x="392" y="260" width="400" height="132" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <rect x="424" y="290" width="158" height="92" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <rect x="602" y="290" width="158" height="92" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Le bas de la voiture -->
  <rect x="236" y="386" width="728" height="176" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="592" y1="392" x2="592" y2="556" fill="none" stroke="#2f3d4a" stroke-width="6"/>
  <line x1="622" y1="428" x2="662" y2="428" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <line x1="522" y1="428" x2="562" y2="428" fill="none" stroke="#2f3d4a" stroke-width="10"/>
  <!-- Les phares -->
  <circle cx="962" cy="440" r="34" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="238" cy="440" r="30" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <!-- Les roues -->
  <circle cx="412" cy="566" r="78" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="412" cy="566" r="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="790" cy="566" r="78" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
  <circle cx="790" cy="566" r="32" fill="#ffffff" stroke="#2f3d4a" stroke-width="6"/>
</svg>
