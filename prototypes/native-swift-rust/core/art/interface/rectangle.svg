  <title>Rectangle</title>
  <rect x="12" y="16" width="40" height="32" rx="2" fill="none" stroke="#293d4b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="12" y="16" width="40" height="32" rx="2" fill="none" stroke="#43ac9c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="12" cy="16" rx="5.5" ry="5.5" fill="#ffcd62" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="52" cy="48" rx="5.5" ry="5.5" fill="#ed8c88" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
