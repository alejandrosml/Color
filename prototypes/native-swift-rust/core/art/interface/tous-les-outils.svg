<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le bouton « Tous les outils » d'un rail, qui ouvre son tiroir (Color 1.2, « Les galets »). Dessin original, grille de 64 unités. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Tous les outils</title>
  <g stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="6" fill="#43ac9c"/>
    <circle cx="32" cy="14" r="6" fill="#ffcd62"/>
    <circle cx="50" cy="14" r="6" fill="#9a82c9"/>
    <circle cx="14" cy="32" r="6" fill="#ffcd62"/>
    <circle cx="32" cy="32" r="6" fill="#9a82c9"/>
    <circle cx="50" cy="32" r="6" fill="#ed8c88"/>
    <circle cx="14" cy="50" r="6" fill="#9a82c9"/>
    <circle cx="32" cy="50" r="6" fill="#ed8c88"/>
    <circle cx="50" cy="50" r="6" fill="#43ac9c"/>
  </g>
</svg>
