<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Cœur », n° 1. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Cœur</title>
  <path d="M 50 88 C 22 66 7 50 7 32 C 7 18 18 9 30 9 C 39 9 46 14 50 22 C 54 14 61 9 70 9 C 82 9 93 18 93 32 C 93 50 78 66 50 88 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 28 C 36 31.31 32.42 34 28 34 C 23.58 34 20 31.31 20 28 C 20 24.69 23.58 22 28 22 C 32.42 22 36 24.69 36 28 Z" fill="#efbebb" data-fill="claire"/>
</svg>
