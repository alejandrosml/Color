<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Nuage », n° 4. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Nuage</title>
  <path d="M 24 78 C 8 78 3 62 12 52 C 8 38 20 28 32 33 C 36 18 56 14 65 27 C 80 21 95 33 89 49 C 99 58 94 78 78 78 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30 66 C 36 70 46 70 52 66" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
