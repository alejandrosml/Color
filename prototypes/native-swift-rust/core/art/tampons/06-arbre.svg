  <path d="M 56 34 C 60 40 68 40 72 35" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 44 24 C 47 28 52 28 55 25" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
