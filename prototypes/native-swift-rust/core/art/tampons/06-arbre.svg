<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Arbre », n° 6. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Arbre</title>
  <path d="M 39 95 C 44 90 44 78 45 60 L 55 60 C 56 78 56 90 61 95 Z" fill="#9a6b4a" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 72 L 50 88" fill="none" stroke="#7d5338" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 66 L 50 74 L 54 66" fill="none" stroke="#7d5338" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 7 C 62 5 72 11 75 20 C 87 20 95 30 93 42 C 93 54 83 62 71 62 C 65 68 53 70 46 66 C 38 70 26 68 22 60 C 12 58 5 48 7 38 C 5 28 13 20 24 20 C 28 10 40 5 50 7 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 93 42 C 93 54 83 62 71 62 C 65 68 53 70 46 66 C 38 70 26 68 22 60 C 30 62 40 60 46 57 C 54 61 64 59 70 53 C 80 54 90 50 93 42 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 50 7 C 62 5 72 11 75 20 C 87 20 95 30 93 42 C 93 54 83 62 71 62 C 65 68 53 70 46 66 C 38 70 26 68 22 60 C 12 58 5 48 7 38 C 5 28 13 20 24 20 C 28 10 40 5 50 7 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40.93 20 C 42.14 22.1 40.03 25.6 36.2 27.81 C 32.37 30.02 28.29 30.1 27.07 28 C 25.86 25.9 27.97 22.4 31.8 20.19 C 35.63 17.98 39.71 17.9 40.93 20 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 65.87 16.75 C 66.26 18.59 63.94 20.64 60.71 21.33 C 57.47 22.01 54.52 21.09 54.13 19.25 C 53.74 17.41 56.06 15.36 59.29 14.67 C 62.53 13.99 65.48 14.91 65.87 16.75 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 22.6 38 C 22.6 39.44 21.44 40.6 20 40.6 C 18.56 40.6 17.4 39.44 17.4 38 C 17.4 36.56 18.56 35.4 20 35.4 C 21.44 35.4 22.6 36.56 22.6 38 Z" fill="#efbebb" data-fill="claire"/>
