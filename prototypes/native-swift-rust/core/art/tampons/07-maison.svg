  <path d="M 21 46 L 79 46 L 79 91 L 21 91 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8 51 L 50 13 L 92 51 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 50 13 L 92 51 L 76 51 L 50 27 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 8 51 L 50 13 L 92 51 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 26 40 L 44 24" fill="none" stroke="#efbebb" data-stroke="claire" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 55.4 38 C 55.4 40.98 52.98 43.4 50 43.4 C 47.02 43.4 44.6 40.98 44.6 38 C 44.6 35.02 47.02 32.6 50 32.6 C 52.98 32.6 55.4 35.02 55.4 38 Z" fill="#a8d8f0" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
