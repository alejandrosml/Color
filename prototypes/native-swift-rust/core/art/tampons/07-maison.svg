  <path d="M 32 58 L 32 71 M 26 64.5 L 38 64.5" fill="none" stroke="#293d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 62 58 L 74 58 L 74 71 L 62 71 Z" fill="#a8d8f0" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
