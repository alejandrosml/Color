<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Maison », n° 7. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Maison</title>
  <path d="M 64 13 L 75 13 L 75 38 L 64 30 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 61 9 L 78 9 L 78 15 L 61 15 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 21 46 L 79 46 L 79 91 L 21 91 Z" fill="#fffcf0" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
