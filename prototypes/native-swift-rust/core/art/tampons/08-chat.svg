  <path d="M 18 44 L 14 12 L 38 24 C 46 21 54 21 62 24 L 86 12 L 82 44 C 90 62 76 87 50 87 C 24 87 10 62 18 44 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20.6 21.4 L 33 27.6 L 22.6 36 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 79.4 21.4 L 67 27.6 L 77.4 36 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 50 25 L 50 35 M 42 26 L 43 34 M 58 26 L 57 34" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
