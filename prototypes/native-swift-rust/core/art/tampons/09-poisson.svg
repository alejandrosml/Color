<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Poisson », n° 9. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Poisson</title>
  <path d="M 66 50 L 94 30 L 88 50 L 94 70 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 76 50 C 76 62.7 60.78 73 42 73 C 23.22 73 8 62.7 8 50 C 8 37.3 23.22 27 42 27 C 60.78 27 76 37.3 76 50 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 28 C 46 14 60 14 62 28 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30.5 44 C 30.5 47.59 27.59 50.5 24 50.5 C 20.41 50.5 17.5 47.59 17.5 44 C 17.5 40.41 20.41 37.5 24 37.5 C 27.59 37.5 30.5 40.41 30.5 44 Z" fill="#fffcf0"/>
  <path d="M 26 44 C 26 45.66 24.66 47 23 47 C 21.34 47 20 45.66 20 44 C 20 42.34 21.34 41 23 41 C 24.66 41 26 42.34 26 44 Z" fill="#293d4b"/>
  <path d="M 12 56 C 16 60 22 61 26 58" fill="none" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 42 C 52 46 52 54 46 58" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
