<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Poisson », n° 9. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Poisson</title>
  <path d="M 76 50 L 95 30 C 91 43 91 58 95 71 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 38 28 C 42 14 58 12 63 21 C 61 26 59 28 57 30 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 9 52 C 13 34 35 23 56 27 C 69 30 77 38 81 49 C 77 63 65 73 50 75 C 31 77 13 68 9 52 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 13 60 C 26 71 46 73 62 66 C 50 78 26 77 13 60 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 9 52 C 13 34 35 23 56 27 C 69 30 77 38 81 49 C 77 63 65 73 50 75 C 31 77 13 68 9 52 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 36 36 C 41 45 41 57 36 66" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 49 39 C 53 43 53 50 49 54 M 59 41 C 63 45 63 52 59 56 M 68 45 C 71 48 71 53 68 56" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 44 57 C 50 55 56 59 56 65 C 50 65 46 63 44 57 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30.2 46 C 30.2 49.42 27.42 52.2 24 52.2 C 20.58 52.2 17.8 49.42 17.8 46 C 17.8 42.58 20.58 39.8 24 39.8 C 27.42 39.8 30.2 42.58 30.2 46 Z" fill="#ffffff" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 26 46.4 C 26 48.06 24.66 49.4 23 49.4 C 21.34 49.4 20 48.06 20 46.4 C 20 44.74 21.34 43.4 23 43.4 C 24.66 43.4 26 44.74 26 46.4 Z" fill="#293d4b"/>
  <path d="M 23 45 C 23 45.55 22.55 46 22 46 C 21.45 46 21 45.55 21 45 C 21 44.45 21.45 44 22 44 C 22.55 44 23 44.45 23 45 Z" fill="#ffffff"/>
  <path d="M 11 56 C 14 59 18 59 20.6 57" fill="none" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 34 54 C 34 55.66 32.66 57 31 57 C 29.34 57 28 55.66 28 54 C 28 52.34 29.34 51 31 51 C 32.66 51 34 52.34 34 54 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 13.2 30 C 13.2 32.32 11.32 34.2 9 34.2 C 6.68 34.2 4.8 32.32 4.8 30 C 4.8 27.68 6.68 25.8 9 25.8 C 11.32 25.8 13.2 27.68 13.2 30 Z" fill="#a8d8f0" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
