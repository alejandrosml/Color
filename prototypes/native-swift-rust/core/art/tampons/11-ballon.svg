<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Ballon », n° 11. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Ballon</title>
  <path d="M 50 78 C 42 84 58 90 50 97" fill="none" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 45 71 L 55 71 L 53 79 L 47 79 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 79 40 C 79 58.23 66.02 73 50 73 C 33.98 73 21 58.23 21 40 C 21 21.77 33.98 7 50 7 C 66.02 7 79 21.77 79 40 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 46 27 C 46 32.52 42.87 37 39 37 C 35.13 37 32 32.52 32 27 C 32 21.48 35.13 17 39 17 C 42.87 17 46 21.48 46 27 Z" fill="#efbebb" data-fill="claire"/>
</svg>
