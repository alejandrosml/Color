<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Bateau », n° 13. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Bateau</title>
  <path d="M 48 62 L 48 12" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 16 L 53 55 L 86 55 Z" fill="#fffcf0" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 43 24 L 43 55 L 20 55 Z" fill="#efbebb" data-fill="claire" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8 62 L 92 62 L 76 86 L 24 86 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20 72 L 80 72" fill="none" stroke="#96413c" data-stroke="sombre" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
