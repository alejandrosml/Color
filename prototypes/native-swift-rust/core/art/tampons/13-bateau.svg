<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Bateau », n° 13. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Bateau</title>
  <path d="M 48 62 L 48 8" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 48 8 L 63 13 L 48 19 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 17 L 86 56 L 53 56 Z" fill="#fffcf0" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 53 44 L 76 44 M 53 33 L 66.6 33" fill="none" stroke="#e3d8ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 43 26 L 43 56 L 18 56 Z" fill="#efbebb" data-fill="claire" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 9 62 L 91 62 L 79 85 L 21 85 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 12.6 69 L 87.4 69 L 84.2 75 L 15.8 75 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 9 62 L 91 62 L 79 85 L 21 85 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
