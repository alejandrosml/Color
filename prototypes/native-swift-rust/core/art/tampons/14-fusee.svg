<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Fusée », n° 14. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Fusée</title>
  <path d="M 36 54 L 18 80 L 36 73 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 64 54 L 82 80 L 64 73 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 40 73 C 42 84 46 91 50 97 C 54 91 58 84 60 73 Z" fill="#ffcd62" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 5 C 68 20 71 46 66 73 L 34 73 C 29 46 32 20 50 5 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 59.5 37 C 59.5 42.25 55.25 46.5 50 46.5 C 44.75 46.5 40.5 42.25 40.5 37 C 40.5 31.75 44.75 27.5 50 27.5 C 55.25 27.5 59.5 31.75 59.5 37 Z" fill="#a8d8f0" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 49.5 34 C 49.5 35.38 48.38 36.5 47 36.5 C 45.62 36.5 44.5 35.38 44.5 34 C 44.5 32.62 45.62 31.5 47 31.5 C 48.38 31.5 49.5 32.62 49.5 34 Z" fill="#fffcf0"/>
</svg>
