  <path d="M 50 31 C 50 22 52 15 57 10" fill="none" stroke="#9a6b4a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 57 20 C 63 8 78 6 86 11 C 82 23 68 28 57 20 Z" fill="#6fb873" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 60 19 C 68 17 76 14 82 12" fill="none" stroke="#4f9a5d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 30 C 40 20 16 22 12 46 C 8 70 26 93 42 91 C 46 91 48 89 50 89 C 52 89 54 91 58 91 C 74 93 92 70 88 46 C 84 22 60 20 50 30 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 48.7 32.08 C 40 23.38 19.12 25.12 15.64 46 C 12.16 66.88 27.82 86.89 41.74 85.15 C 45.22 85.15 46.96 83.41 48.7 83.41 C 50.44 83.41 52.18 85.15 55.66 85.15 C 69.58 86.89 85.24 66.88 81.76 46 C 78.28 25.12 57.4 23.38 48.7 32.08 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 50 30 C 40 20 16 22 12 46 C 8 70 26 93 42 91 C 46 91 48 89 50 89 C 52 89 54 91 58 91 C 74 93 92 70 88 46 C 84 22 60 20 50 30 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 33.81 47.38 C 32.28 52.68 28.9 56.37 26.24 55.61 C 23.59 54.85 22.67 49.93 24.19 44.62 C 25.72 39.32 29.1 35.63 31.76 36.39 C 34.41 37.15 35.33 42.07 33.81 47.38 Z" fill="#efbebb" data-fill="claire"/>
  <path d="M 39.4 32 C 39.4 33.33 38.33 34.4 37 34.4 C 35.67 34.4 34.6 33.33 34.6 32 C 34.6 30.67 35.67 29.6 37 29.6 C 38.33 29.6 39.4 30.67 39.4 32 Z" fill="#efbebb" data-fill="claire"/>
