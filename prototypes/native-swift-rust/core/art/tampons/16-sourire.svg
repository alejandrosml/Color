<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Sourire », n° 16. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Sourire</title>
  <path d="M 91 50 C 91 72.64 72.64 91 50 91 C 27.36 91 9 72.64 9 50 C 9 27.36 27.36 9 50 9 C 72.64 9 91 27.36 91 50 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 32 58 C 32 61.31 29.31 64 26 64 C 22.69 64 20 61.31 20 58 C 20 54.69 22.69 52 26 52 C 29.31 52 32 54.69 32 58 Z" fill="#ed8c88"/>
  <path d="M 80 58 C 80 61.31 77.31 64 74 64 C 70.69 64 68 61.31 68 58 C 68 54.69 70.69 52 74 52 C 77.31 52 80 54.69 80 58 Z" fill="#ed8c88"/>
  <path d="M 40.5 42 C 40.5 45.59 38.49 48.5 36 48.5 C 33.51 48.5 31.5 45.59 31.5 42 C 31.5 38.41 33.51 35.5 36 35.5 C 38.49 35.5 40.5 38.41 40.5 42 Z" fill="#293d4b"/>
  <path d="M 68.5 42 C 68.5 45.59 66.49 48.5 64 48.5 C 61.51 48.5 59.5 45.59 59.5 42 C 59.5 38.41 61.51 35.5 64 35.5 C 66.49 35.5 68.5 38.41 68.5 42 Z" fill="#293d4b"/>
  <path d="M 32 60 C 38 74 62 74 68 60" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
