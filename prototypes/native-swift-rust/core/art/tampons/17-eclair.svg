<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Éclair », n° 17. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Éclair</title>
  <path d="M 57 5 L 23 53 L 45 53 L 35 95 L 79 41 L 55 41 L 69 5 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 69 5 L 55 41 L 79 41 L 35 95 L 62 47 L 47 47 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 57 5 L 23 53 L 45 53 L 35 95 L 79 41 L 55 41 L 69 5 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 54 14 L 33 46" fill="none" stroke="#efbebb" data-stroke="claire" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 20 16 L 22.12 21.88 L 28 24 L 22.12 26.12 L 20 32 L 17.88 26.12 L 12 24 L 17.88 21.88 Z" fill="#ffcd62" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 82 65 L 83.84 70.16 L 89 72 L 83.84 73.84 L 82 79 L 80.16 73.84 L 75 72 L 80.16 70.16 Z" fill="#ffcd62" stroke="#293d4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 86 15.4 L 87.27 18.73 L 90.6 20 L 87.27 21.27 L 86 24.6 L 84.73 21.27 L 81.4 20 L 84.73 18.73 Z" fill="#ffcd62" stroke="#293d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
