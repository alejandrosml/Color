<!-- Color : le tampon « Champignon », n° 18. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Champignon</title>
  <path d="M 36 50 L 64 50 C 64 66 68 80 72 90 L 28 90 C 32 80 36 66 36 50 Z" fill="#fffcf0" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 8 54 C 8 26 28 9 50 9 C 72 9 92 26 92 54 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 39.5 31 C 39.5 35.14 36.14 38.5 32 38.5 C 27.86 38.5 24.5 35.14 24.5 31 C 24.5 26.86 27.86 23.5 32 23.5 C 36.14 23.5 39.5 26.86 39.5 31 Z" fill="#fffcf0"/>
  <path d="M 64 25 C 64 28.31 61.31 31 58 31 C 54.69 31 52 28.31 52 25 C 52 21.69 54.69 19 58 19 C 61.31 19 64 21.69 64 25 Z" fill="#fffcf0"/>
  <path d="M 79.5 42 C 79.5 45.04 77.04 47.5 74 47.5 C 70.96 47.5 68.5 45.04 68.5 42 C 68.5 38.96 70.96 36.5 74 36.5 C 77.04 36.5 79.5 38.96 79.5 42 Z" fill="#fffcf0"/>
  <path d="M 52.5 43 C 52.5 45.49 50.49 47.5 48 47.5 C 45.51 47.5 43.5 45.49 43.5 43 C 43.5 40.51 45.51 38.5 48 38.5 C 50.49 38.5 52.5 40.51 52.5 43 Z" fill="#fffcf0"/>
</svg>
