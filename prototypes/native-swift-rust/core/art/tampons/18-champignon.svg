<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Champignon », n° 18. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Champignon</title>
  <path d="M 38 60 C 38 75 34 85 31 93 L 69 93 C 66 85 62 75 62 60 Z" fill="#fffcf0"/>
  <path d="M 56 60 C 57 75 61 85 64 93 L 69 93 C 66 85 62 75 62 60 Z" fill="#efe3c6"/>
  <path d="M 38 60 C 38 75 34 85 31 93 L 69 93 C 66 85 62 75 62 60 Z" fill="none" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 37 70 C 45 74 55 74 63 70" fill="none" stroke="#e0d2ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 7 55 C 7 28 27 9 50 9 C 73 9 93 28 93 55 C 93 61 85 61 79 61 L 21 61 C 15 61 7 61 7 55 Z" fill="#d75e56" data-fill="couleur"/>
  <path d="M 8.6 49 C 11 58 15 61 21 61 L 79 61 C 85 61 89 58 91.4 49 C 85 54 77 55 70 55 L 30 55 C 23 55 15 54 8.6 49 Z" fill="#96413c" data-fill="sombre"/>
  <path d="M 38.4 33 C 38.4 37.64 34.64 41.4 30 41.4 C 25.36 41.4 21.6 37.64 21.6 33 C 21.6 28.36 25.36 24.6 30 24.6 C 34.64 24.6 38.4 28.36 38.4 33 Z" fill="#fffcf0"/>
  <path d="M 61.4 23 C 61.4 26.53 58.53 29.4 55 29.4 C 51.47 29.4 48.6 26.53 48.6 23 C 48.6 19.47 51.47 16.6 55 16.6 C 58.53 16.6 61.4 19.47 61.4 23 Z" fill="#fffcf0"/>
  <path d="M 81.2 39 C 81.2 42.98 77.98 46.2 74 46.2 C 70.02 46.2 66.8 42.98 66.8 39 C 66.8 35.02 70.02 31.8 74 31.8 C 77.98 31.8 81.2 35.02 81.2 39 Z" fill="#fffcf0"/>
