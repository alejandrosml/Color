<!-- Color : le tampon « Couronne », n° 19. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Couronne</title>
  <path d="M 10 82 L 10 32 L 31 54 L 50 20 L 69 54 L 90 32 L 90 82 Z" fill="#d75e56" data-fill="couleur" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 10 68 L 90 68 L 90 82 L 10 82 Z" fill="#96413c" data-fill="sombre" stroke="#293d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 16 30 C 16 33.31 13.31 36 10 36 C 6.69 36 4 33.31 4 30 C 4 26.69 6.69 24 10 24 C 13.31 24 16 26.69 16 30 Z" fill="#ed8c88" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 56 18 C 56 21.31 53.31 24 50 24 C 46.69 24 44 21.31 44 18 C 44 14.69 46.69 12 50 12 C 53.31 12 56 14.69 56 18 Z" fill="#43ac9c" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 96 30 C 96 33.31 93.31 36 90 36 C 86.69 36 84 33.31 84 30 C 84 26.69 86.69 24 90 24 C 93.31 24 96 26.69 96 30 Z" fill="#9a82c9" stroke="#293d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 33.5 75 C 33.5 76.93 31.93 78.5 30 78.5 C 28.07 78.5 26.5 76.93 26.5 75 C 26.5 73.07 28.07 71.5 30 71.5 C 31.93 71.5 33.5 73.07 33.5 75 Z" fill="#ffcd62"/>
  <path d="M 53.5 75 C 53.5 76.93 51.93 78.5 50 78.5 C 48.07 78.5 46.5 76.93 46.5 75 C 46.5 73.07 48.07 71.5 50 71.5 C 51.93 71.5 53.5 73.07 53.5 75 Z" fill="#ffcd62"/>
  <path d="M 73.5 75 C 73.5 76.93 71.93 78.5 70 78.5 C 68.07 78.5 66.5 76.93 66.5 75 C 66.5 73.07 68.07 71.5 70 71.5 C 71.93 71.5 73.5 73.07 73.5 75 Z" fill="#ffcd62"/>
</svg>
