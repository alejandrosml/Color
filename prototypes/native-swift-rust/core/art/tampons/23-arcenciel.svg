<?xml version="1.0" encoding="UTF-8"?>
<!-- Color : le tampon « Arc-en-ciel », n° 23. Dessin original, grille de 100 unités.
     Son numéro est celui que gardent les projets : un tampon s’ajoute à la fin, sans jamais
     changer de place. data-fill et data-stroke disent quelle peinture suit la couleur que
     l’enfant choisit : « couleur » elle-même, « sombre » (7/10 de chaque canal), « claire »
     (6/10 de l’écart au blanc en plus) ; ici montrée avec le coquelicot, #d75e56.
     L’arc-en-ciel garde ses couleurs : six arcs, puis le contour d’encre qui les tient. Aucune
     n’est une couleur nommée de la palette, ni proche de l’une d’elles : sur une feuille de cette
     couleur, l’arc disparaîtrait. Les bouts ronds des arcs restent sous la ligne du contour.
     Créé par Alejandro San Martin Lamas (https://github.com/alejandrosml). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Arc-en-ciel</title>
  <path d="M 6.4 71.4 C 6.4 49.32 25.92 29.8 50 29.8 C 74.08 29.8 93.6 49.32 93.6 71.4" fill="none" stroke="#f53a28" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 12.6 71.4 C 12.6 52.74 29.34 36 50 36 C 70.66 36 87.4 52.74 87.4 71.4" fill="none" stroke="#fc7d1c" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 18.8 71.4 C 18.8 56.17 32.77 42.2 50 42.2 C 67.23 42.2 81.2 56.17 81.2 71.4" fill="none" stroke="#ffd92e" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 25 71.4 C 25 59.59 36.19 48.4 50 48.4 C 63.81 48.4 75 59.59 75 71.4" fill="none" stroke="#6fcf5a" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 31.2 71.4 C 31.2 63.02 39.62 54.6 50 54.6 C 60.38 54.6 68.8 63.02 68.8 71.4" fill="none" stroke="#5aa9f5" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 37.4 71.4 C 37.4 66.44 43.04 60.8 50 60.8 C 56.96 60.8 62.6 66.44 62.6 71.4" fill="none" stroke="#a678e8" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 3.2 73.4 C 3.2 47.55 24.15 26.6 50 26.6 C 75.85 26.6 96.8 47.55 96.8 73.4 L 59.6 73.4 C 59.6 68.1 55.3 63.8 50 63.8 C 44.7 63.8 40.4 68.1 40.4 73.4 Z" fill="none" stroke="#293d4b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
