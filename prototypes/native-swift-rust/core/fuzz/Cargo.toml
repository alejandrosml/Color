# SPDX-License-Identifier: MIT
# The fuzzer of the reader of projects (Q-01 of the retrospective of October
# 2026): guided by coverage, in Rust only. It is a tool of development, never
# built into Color. See src/main.rs for how to build and run it.
[package]
name = "edupaint_core_fuzz"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# A workspace of its own, apart from the core.
[workspace]

[dependencies]
# The core of the stores, without the reading of SVG files: the reader of
# projects needs only miniz_oxide, for the compressed blocks of version 6.
edupaint_core = { path = "..", default-features = false, features = ["deflate"] }

[profile.release]
debug-assertions = true
overflow-checks = true
codegen-units = 16
